[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolioos-benchmarked"
version = "0.1.0"
description = "Benchmark-aware systematic portfolio research"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "cvxpy>=1.5,<2", "clarabel>=0.9,<1", "PyYAML>=6,<7", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.11,<1"]
notebook = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "ipython>=8,<10"]
app = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
include = ["portfolioos*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
